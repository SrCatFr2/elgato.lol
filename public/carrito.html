
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080914">
  <meta name="referrer" content="no-referrer">
  <title>Carrito — elgato.lol</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>

<body data-page="cart">
  <div id="site-header"></div>

  <main class="page-wrap">
    <section class="page-banner compact-banner">
      <span class="eyebrow">TU SELECCIÓN</span>
      <h1>Tu <span>carrito.</span></h1>
      <p>Revisa los productos antes de crear tu factura de pago cripto.</p>
    </section>

    <section class="cart-layout">
      <div id="cart-items" class="cart-items panel"></div>

      <aside class="cart-summary panel">
        <span class="eyebrow">RESUMEN</span>
        <h2>Tu pedido</h2>

        <div class="summary-line">
          <span>Productos</span>
          <strong id="cart-subtotal">$0 MXN</strong>
        </div>

        <div class="summary-line">
          <span>Pago</span>
          <strong>Criptomonedas</strong>
        </div>

        <div class="summary-total">
          <span>Total</span>
          <strong id="cart-total">$0 MXN</strong>
        </div>

        <form id="checkout-form">
          <button class="button primary full" type="submit">
            Pagar con criptomonedas →
          </button>
        </form>

        <p class="form-note">
          El pago se completa en el checkout de BTCPay. La entrega se libera
          tras confirmar el pago. Guarda el enlace de tu pedido al regresar.
        </p>

        <div id="checkout-result" aria-live="polite"></div>
      </aside>
    </section>
  </main>

  <div id="site-footer"></div>
</body>
</html>
